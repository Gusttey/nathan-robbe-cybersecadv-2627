name: Security Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. SECRET SCANNING & SCA — DSOMM: Secret Management & SCA (Level 2/3)
  # =========================================================================
  security-scan:
    name: Security Scan (Trivy Secrets & SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability and Secret Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: false

  # =========================================================================
  # 2. STATIC APPLICATION SECURITY TESTING (SAST) — DSOMM: Static Depth (Level 2)
  # =========================================================================
  sast:
    name: Static Application Security Testing (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: semgrep scan --config auto --severity ERROR --error

  # =========================================================================
  # 3. CONTINUOUS DEPLOYMENT (CD)
  # =========================================================================
  deploy:
    name: Deploy to Server
    needs: [security-scan, sast]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote deployment commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /pad/naar/jouw/e2ee-app
            git pull origin main
            docker compose pull
            docker compose up -d --build
