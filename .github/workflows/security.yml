name: Security Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. SECRET SCANNING — DSOMM: Secret Management (Level 2)
  # =========================================================================
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 2. SOFTWARE COMPOSITION ANALYSIS (SCA) — DSOMM: Software Composition Analysis (Level 2)
  # =========================================================================
  sca:
    name: Software Composition Analysis (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: false

  # =========================================================================
  # 3. STATIC APPLICATION SECURITY TESTING (SAST) — DSOMM: Static Depth (Level 2)
  # =========================================================================
  sast:
    name: Static Application Security Testing (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: semgrep scan --config auto --severity ERROR --error

  # =========================================================================
  # 4. CONTINUOUS DEPLOYMENT (CD) 
  # =========================================================================

  # Will add a self-hosted runner in the future
